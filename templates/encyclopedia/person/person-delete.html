{% extends 'shared/base.html' %}

{% block title %}Delete {{ person.first_name }} - Great Minds{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-gray-800 p-8 rounded-lg shadow-xl border border-red-700 mt-10">
    <h1 class="text-2xl font-bold text-red-500 mb-4">Are you sure?</h1>
    <p class="text-gray-300 mb-6">
        Do you really want to delete
        <strong>
            {{ person.first_name }} {{ person.last_name }}
        </strong>
        ? This action cannot be undone.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-4">
            <a href="{% url 'encyclopedia:detail' person.slug %}" class="text-gray-400 hover:text-white px-4 py-2 rounded-md transition">
                Cancel
            </a>
            <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-md transition">
                Yes, Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
